image: docker:latest

variables:
    IMAGE_REGISTRY: docker.io
    IMAGE_NAME: $DOCKERHUB_USERNAME/text-extractor-service
    TAG_LATEST: $IMAGE_REGISTRY/$IMAGE_NAME:latest
    TAG_COMMIT: $IMAGE_REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA

build:
    stage: build
    only:
        - main
    services:
        - docker:dind
    script:
        - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_TOKEN $IMAGE_REGISTRY
        - docker info
        - docker pull $TAG_LATEST || true
        - docker build --cache-from $TAG_LATEST -t $TAG_COMMIT -t $TAG_LATEST .
        - docker push $TAG_LATEST
        - docker push $TAG_COMMIT

deploy:
    stage: deploy
    only:
        - main
    needs:
        - job: build
    variables:
        # RENDER_API_KEY: <api-key>
        CI: true
    before_script:
        - apk add --no-cache curl
    script:
        - curl -fsSL https://raw.githubusercontent.com/render-oss/cli/refs/heads/main/bin/install.sh | sh
        - render deploys create $RENDER_SERVICE_ID --output json --confirm
