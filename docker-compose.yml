name: text_extractor_service

services:
  extractor_service:
    build: .
    container_name: extractor_service
    ports:
      - '8002:8002'
    environment:
      # DB
      POSTGRES_URL: 'postgresql+asyncpg://postgres:postgres@localhost:5432/text_analysis_db'
      # Ollama
      OLLAMA_HOST: 'http://localhost:11434'
      LLM_SUMMARY_MODEL: mistral:latest
      # CORS
      CORS_ORIGINS: http://localhost:4200
    working_dir: /app
    volumes:
      - ./app:/app/app
