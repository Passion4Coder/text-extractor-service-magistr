name: text_extractor_service

services:
  extractor_service:
    build: .
    container_name: extractor_service
    ports:
      - '8002:8002'
    environment:
      POSTGRES_URL: 'postgresql+asyncpg://postgres:postgres@db:5432/text_analysis_db'
      CORS_ORIGINS: http://localhost:4200
    working_dir: /app
    volumes:
      - ./app:/app/app
